name: Mi primer Github Action
on:
  push:
jobs:
  saludo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      
      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar programa Python
        run: python main.py